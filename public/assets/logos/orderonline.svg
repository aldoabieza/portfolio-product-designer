<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- OrderOnline Signature Dual-Tone Cart & Growth Bars (Matches user's logo orderonline.webp) -->
  <defs>
    <clipPath id="oo-top-cyan">
      <rect x="0" y="0" width="32" height="16.5" />
    </clipPath>
    <clipPath id="oo-bottom-blue">
      <rect x="0" y="16.5" width="32" height="15.5" />
    </clipPath>
  </defs>

  <!-- Wheels (Dark Royal Blue #005CB9) -->
  <circle cx="12" cy="25" r="1.6" fill="#005CB9"/>
  <circle cx="21.5" cy="25" r="1.6" fill="#005CB9"/>

  <!-- Cart Handle and Basket Outline (#005CB9) -->
  <path d="M 6 15.5 C 5.5 13.5 8 12.8 10 14 C 11.8 15 11.8 18.5 14 21 C 16 23.2 20 23.2 22.8 19.8 C 24 18.2 24.5 16.5 24.5 15.8" 
        stroke="#005CB9" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- 3 Growth Bars - Upper Cyan Portion (#00A3E0) -->
  <g clip-path="url(#oo-top-cyan)">
    <!-- Bar 1 (Left) -->
    <rect x="13.5" y="11" width="2.6" height="10" rx="1.3" fill="#00A3E0"/>
    <!-- Bar 2 (Middle) -->
    <rect x="17.2" y="8.5" width="2.6" height="12.5" rx="1.3" fill="#00A3E0"/>
    <!-- Bar 3 (Right Tallest) -->
    <rect x="21" y="5" width="2.6" height="16" rx="1.3" fill="#00A3E0"/>
  </g>

  <!-- 3 Growth Bars - Lower Royal Blue Portion (#005CB9) -->
  <g clip-path="url(#oo-bottom-blue)">
    <!-- U-tube connecting Bar 1 and Bar 2 -->
    <path d="M 13.5 15 V 19 C 13.5 20.8 19.8 20.8 19.8 19 V 15 H 17.2 V 18.2 C 17.2 18.8 16.1 18.8 16.1 18.2 V 15 Z" fill="#005CB9"/>
    <!-- Bar 3 base -->
    <rect x="21" y="15" width="2.6" height="5" rx="1.3" fill="#005CB9"/>
  </g>
</svg>
