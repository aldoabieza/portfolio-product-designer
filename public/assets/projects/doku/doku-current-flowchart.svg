<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      .title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 19px; fill: #111827; }
      .box-text { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 12px; fill: #1F2937; text-anchor: middle; }
      .diamond-text { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 11.5px; fill: #1F2937; text-anchor: middle; }
      .branch-text { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 12px; fill: #374151; }
      .caption-text { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 11px; fill: #111827; }
      .alert-text { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12px; fill: #FFFFFF; text-anchor: middle; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#9CA3AF" />
    </marker>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="10" y="10" width="980" height="760" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" />

  <!-- Section Title -->
  <text x="48" y="58" class="title">Current Flow</text>

  <!-- ==============================================
       ROW 1: Project -> Create UIs -> Does the component exist? -> Call components
       ============================================== -->

  <!-- Node: Project -->
  <rect x="48" y="88" width="96" height="48" rx="6" fill="#E5E7EB" />
  <text x="96" y="117" class="box-text">Project</text>

  <!-- Arrow Project -> Create UIs -->
  <line x1="144" y1="112" x2="204" y2="112" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Node: Create UIs -->
  <rect x="204" y="88" width="96" height="48" rx="6" fill="#E5E7EB" />
  <text x="252" y="117" class="box-text">Create UIs</text>

  <!-- Arrow Create UIs -> Diamond 1 -->
  <line x1="300" y1="112" x2="342" y2="112" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Diamond: Does the component exist? -->
  <g transform="translate(344, 70)">
    <polygon points="72,0 144,42 72,84 0,42" fill="#FEF08A" stroke="#F59E0B" stroke-width="1.2" />
    <text x="72" y="33" class="diamond-text">Does the</text>
    <text x="72" y="47" class="diamond-text">component</text>
    <text x="72" y="61" class="diamond-text">exist?</text>
  </g>

  <!-- Branch YES from Diamond 1 -->
  <line x1="488" y1="112" x2="548" y2="112" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)" />
  <text x="508" y="106" class="branch-text">yes</text>

  <!-- Node: Call components from our DS library -->
  <rect x="548" y="88" width="126" height="48" rx="6" fill="#E5E7EB" />
  <text x="611" y="111" class="box-text">Call components</text>
  <text x="611" y="125" class="box-text">from our DS library</text>

  <!-- Branch NO from Diamond 1: Goes down to Row 2 -->
  <path d="M416 154 L416 200 L152 200 L152 240" stroke="#9CA3AF" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="422" y="178" class="branch-text">no</text>

  <!-- ==============================================
       ROW 2: Dashed Red Box 1 (Local Components & FE) -> Push to Repo
       ============================================== -->

  <!-- Dashed Red Box 1 -->
  <rect x="98" y="240" width="262" height="68" rx="8" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="8,6" />

  <!-- Node: Create new local components -->
  <rect x="110" y="250" width="106" height="48" rx="6" fill="#E5E7EB" />
  <text x="163" y="273" class="box-text">Create new local</text>
  <text x="163" y="287" class="box-text">components</text>

  <!-- Arrow between local components and Design Implemented -->
  <line x1="216" y1="274" x2="242" y2="274" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Node: Design Implemented to FE -->
  <rect x="244" y="250" width="106" height="48" rx="6" fill="#E5E7EB" />
  <text x="297" y="273" class="box-text">Design Implemented</text>
  <text x="297" y="287" class="box-text">to FE</text>

  <!-- Caption below Dashed Box 1 -->
  <text x="98" y="326" class="caption-text">There&#39;s no update components in our DS Library</text>

  <!-- Arrow from Box 1 to Box 2 -->
  <line x1="360" y1="274" x2="436" y2="274" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Dashed Red Box 2 (Push to Project Repo) -->
  <rect x="438" y="240" width="130" height="68" rx="8" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="8,6" />

  <!-- Node: Push to Project Repository -->
  <rect x="450" y="250" width="106" height="48" rx="6" fill="#E5E7EB" />
  <text x="503" y="273" class="box-text">Push to Project</text>
  <text x="503" y="287" class="box-text">Repository</text>

  <!-- Caption below arrow to Box 2 -->
  <text x="438" y="326" class="caption-text">DS Repository doesn&#39;t update</text>
  <text x="438" y="340" class="caption-text">from FE</text>

  <!-- ==============================================
       ROW 3: Decision 2 -> Branch YES / NO into Dashed Box 3
       ============================================== -->

  <!-- Vertical connector down from the line between Design Implemented and Push to Project Repository -->
  <path d="M404 274 L404 434 L432 434" stroke="#9CA3AF" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- Diamond: Does other Designers get informed? -->
  <g transform="translate(434, 392)">
    <polygon points="72,0 144,42 72,84 0,42" fill="#FEF08A" stroke="#F59E0B" stroke-width="1.2" />
    <text x="72" y="33" class="diamond-text">Does other</text>
    <text x="72" y="47" class="diamond-text">Designers get</text>
    <text x="72" y="61" class="diamond-text">informed?</text>
  </g>

  <!-- Branch YES from Diamond 2 -->
  <line x1="578" y1="434" x2="646" y2="434" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)" />
  <text x="600" y="428" class="branch-text">yes</text>

  <!-- Branch NO from Diamond 2 -->
  <path d="M506 476 L506 524 L646 524" stroke="#9CA3AF" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="574" y="518" class="branch-text">no</text>

  <!-- Dashed Red Box 3 (Outcomes) -->
  <rect x="648" y="400" width="138" height="154" rx="8" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="8,6" />

  <!-- Node: Copy components from other projects (YES branch) -->
  <rect x="660" y="412" width="114" height="48" rx="6" fill="#E5E7EB" />
  <text x="717" y="435" class="box-text">Copy components</text>
  <text x="717" y="449" class="box-text">from other projects</text>

  <!-- Node: Confusion, and create new components (NO branch - Red/Orange Alert Box) -->
  <rect x="660" y="496" width="114" height="48" rx="6" fill="#EA3A1E" />
  <text x="717" y="517" class="alert-text">Confusion, and</text>
  <text x="717" y="529" class="alert-text">create new</text>
  <text x="717" y="541" class="alert-text">components</text>

  <!-- Caption below Dashed Box 3 -->
  <text x="648" y="576" class="caption-text">Slow Development Process &amp;</text>
  <text x="648" y="590" class="caption-text">There&#39;s a GAP</text>

</svg>